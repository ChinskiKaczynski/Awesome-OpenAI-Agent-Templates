name: Customer Support Offline Tests

on:
  push:
    branches: [main]
    paths:
      - 'Agents-SDK-Python/customer-support-agent/**'
      - '.github/workflows/customer-support-offline.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Agents-SDK-Python/customer-support-agent/**'
      - '.github/workflows/customer-support-offline.yml'

jobs:
  support-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested Agents SDK
        run: python -m pip install 'openai-agents==0.24.0'
      - name: Run offline support regression tests
        run: python -m unittest discover -s Agents-SDK-Python/customer-support-agent -p 'test_*.py' -v

name: Computer Use Offline Browser Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'Built-in-Tools/computer-use-agent/**'
      - '.github/workflows/computer-use-offline.yml'
  push:
    branches: [main]
    paths:
      - 'Built-in-Tools/computer-use-agent/**'
      - '.github/workflows/computer-use-offline.yml'

jobs:
  computer-use-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documented SDK and Chromium
        run: |
          python -m pip install -r Built-in-Tools/computer-use-agent/python/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify computer toolset is available
        run: python -c 'from openai import AsyncComputerToolset; print(AsyncComputerToolset.__name__)'
      - name: Run real-browser offline smoke and safety tests
        env:
          OPENAI_API_KEY: ''
        run: |
          python Built-in-Tools/computer-use-agent/python/main.py
          python -m unittest discover -s Built-in-Tools/computer-use-agent/python -p 'test_computer.py' -v

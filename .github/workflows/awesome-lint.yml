name: Priority Agent Syntax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-syntax:
    name: Python syntax (priority agents)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile priority Python examples
        run: |
          python3 -m py_compile \
            Agents-SDK-Python/research-agent/main.py \
            Agents-SDK-Python/customer-support-agent/main.py \
            Built-in-Tools/computer-use-agent/python/main.py

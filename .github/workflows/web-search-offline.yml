name: Web Search Offline Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'Built-in-Tools/web-search-agent/python/**'
      - '.github/workflows/web-search-offline.yml'
  push:
    branches: [main]
    paths:
      - 'Built-in-Tools/web-search-agent/python/**'
      - '.github/workflows/web-search-offline.yml'

jobs:
  web-search-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python search contract without API calls
        env:
          OPENAI_API_KEY: ''
        run: |
          python -m py_compile Built-in-Tools/web-search-agent/python/main.py
          python -m unittest discover -s Built-in-Tools/web-search-agent/python -p 'test_search.py' -v
